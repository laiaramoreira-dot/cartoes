<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartões com Descrição</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #4B0082;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 2000px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .circle {
    position: relative;
    width: 600px;
    height: 500px;
    background-color: #FFA500;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .paper {
    position: absolute;
    width: 170px; /* Aumentado levemente para o texto */
    height: 240px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    transform: rotateX(50deg) rotateZ(35deg) skewX(-10deg);
    transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
    
    /* Ajuste para conter Título e Descrição */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 15px;
    box-sizing: border-box;
    text-align: center;
  }

  /* Estilização do Texto */
  .paper h2 {
    margin: 0;
    font-size: 50px;
    color: #333;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .paper p {
    margin: 10px 0 0 0;
    font-size: 14px;
    color: #666;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.5s;
  }

  /* Revela o texto no Hover */
  .circle:hover .paper h2,
  .circle:hover .paper p {
    opacity: 1;
  }

  /* --- POSIÇÃO INICIAL --- */
  .paper:nth-child(1) { z-index: 1; transform: rotateX(50deg) rotateZ(35deg) skewX(-10deg) translate(30px, 30px); }
  .paper:nth-child(2) { z-index: 2; transform: rotateX(50deg) rotateZ(35deg) skewX(-10deg) translate(0, 0); }
  .paper:nth-child(3) { z-index: 3; transform: rotateX(50deg) rotateZ(35deg) skewX(-10deg) translate(-30px, -30px); }

  /* --- ESTADO HOVER --- */
  .circle:hover .paper {
    transform: rotateX(0deg) rotateZ(0deg) skewX(0deg);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  .circle:hover .paper:nth-child(1) { transform: translateX(190px); }
  .circle:hover .paper:nth-child(2) { transform: translateX(0px); }
  .circle:hover .paper:nth-child(3) { transform: translateX(-190px); }

  .paper { border: 1px solid rgba(0,0,0,0.1); }
</style>
</head>
<body>
  <div class="circle">
    <div class="paper">
      <h2>A</h2>
      <p>Espaço para informações rápidas ou títulos curtos.</p>
    </div>

    <div class="paper">
      <h2>B</h2>
      <p>Ideal para descrições de produtos ou serviços.</p>
    </div>

    <div class="paper">
      <h2>C</h2>
      <p>Perfeito para links ou pequenos botões de ação.</p>
    </div>
  </div>
</body>
</html>
